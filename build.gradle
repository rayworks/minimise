import co.joebirch.minimise.buildsrc.Deps
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath Deps.androidGradlePlugin
        classpath Deps.kotlinGradlePlugin
        classpath Deps.composeCompilerGradlePlugin
        classpath Deps.kspGradlePlugin
        classpath Deps.Kotlin.serialization
        classpath Deps.Apollo.plugin
        classpath Deps.Google.Hilt.gradlePlugin
        classpath Deps.BuildKonfig.plugin
    }
}

allprojects {

    // Several modules only contain placeholder test classes with no test methods yet
    tasks.withType(AbstractTestTask).configureEach {
        failOnNoDiscoveredTests = false
    }

    tasks.withType(KotlinJvmCompile).configureEach {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_17)
        }
    }

    repositories {
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
        mavenLocal()
    }
}
