import co.joebirch.minimise.buildsrc.*

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'com.google.dagger.hilt.android'

android {
    namespace = 'co.joebirch.minimise.authentication'

    buildFeatures {
        compose = true
        buildConfig = true
    }

    compileSdk = Versions.compileSdk

    defaultConfig {
        minSdk = Versions.minSdk

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
        buildConfigField "String", "API_KEY", getProps("API_KEY")
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    implementation project(":platform_android:core")
    implementation project(":platform_android:navigation")
    implementation project(':shared:SharedCommon')
    implementation project(':shared:SharedAuthentication')
    implementation project(':platform_android:common-ui')

    implementation platform(Deps.Compose.bom)
    implementation Deps.AndroidX.activityCompose
    implementation Deps.Compose.icons
    implementation Deps.Compose.runtime
    implementation Deps.Compose.layout
    implementation Deps.Compose.livedata
    implementation Deps.Compose.material
    implementation Deps.Compose.tooling
    implementation Deps.Compose.foundation

    implementation Deps.AndroidX.appCompat
    implementation Deps.AndroidX.coreKtx

    implementation Deps.Google.Hilt.hilt
    ksp Deps.Google.Hilt.hiltCompiler

    implementation Deps.Lifecycle.common
    implementation Deps.Lifecycle.viewModelKtx

    testImplementation Deps.junit

    androidTestImplementation platform(Deps.Compose.bom)
    androidTestImplementation Deps.AndroidX.junit
    androidTestImplementation Deps.Compose.test
    debugImplementation Deps.Compose.testManifest

    androidTestImplementation Deps.junit
    androidTestImplementation Deps.AndroidX.testRules
    androidTestImplementation Deps.AndroidX.testRunner
}

def getProps(String propName) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        return props[propName] ?: '""'
    } else {
        return '""'
    }
}
